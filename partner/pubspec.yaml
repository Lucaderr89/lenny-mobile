name: partner
description: "Lenny Partner App - App per ristoratori"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP requests
  http: ^1.2.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Routing
  go_router: ^14.0.2
  
  # Google Fonts
  google_fonts: ^6.2.1
  
  # Date formatting
  intl: ^0.19.0
  
  # Sunmi Printer
  sunmi_printer_plus: ^4.1.1

  # Pannello platform in WebView con autologin (come app driver)
  webview_flutter: ^4.10.0

  # Password cifrata per l'autologin del pannello (come app driver)
  flutter_secure_storage: ^9.2.2
  
  # Audio notifications
  audioplayers: ^6.0.0

  # 🔔 Firebase Push Notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icona applicazione: stessa famiglia delle app cliente e driver,
# sfondo blu brand #0F4E8C.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0F4E8C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
    - assets/sounds/

  # Poppins incluso nell'app invece di scaricato a runtime da google_fonts.
  # Con il download i primi fotogrammi (o l'intera schermata, se non si
  # ricostruisce) uscivano nel font di sistema: San Francisco su iOS. In piu'
  # ogni avvio contattava i server Google trasmettendo l'IP dell'utente.
  # Il nome famiglia deve restare "Poppins": google_fonts riconosce i font
  # dichiarati qui e smette di scaricarli.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

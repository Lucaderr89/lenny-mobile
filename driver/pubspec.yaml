name: driver
description: "Lenny Driver App - App per driver di consegna"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP requests
  http: ^1.2.0
  
  # Local storage
  shared_preferences: ^2.2.2

  # Archivio cifrato (Keystore di Android) per la password usata dall'auto-login
  # del pannello: in SharedPreferences sarebbe salvata in chiaro.
  flutter_secure_storage: ^9.2.2
  
  # Routing
  go_router: ^14.0.2
  
  # Image picker
  image_picker: ^1.0.7
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_storage: ^12.3.8
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.1.5
  flutter_local_notifications: ^18.0.1
  
  # Google Fonts
  google_fonts: ^6.2.1
  
  # Date formatting
  intl: ^0.20.2
  
  # Geolocation
  geolocator: ^11.0.0

  # Icone vettoriali del set custom "Lenny Icons" (assets/icons_svg, condiviso con l app cliente)
  flutter_svg: ^2.0.10

  # Modalita Guida: annunci vocali e schermo sempre acceso con ordini attivi
  flutter_tts: ^4.0.2
  wakelock_plus: ^1.2.8

  # Bolla flottante sopra Google Maps (Modalita Guida, Android)
  flutter_overlay_window: ^0.4.5
  
  # Maps (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # URL launcher
  url_launcher: ^6.2.2
  
  # WebView
  webview_flutter: ^4.10.0
  
  # Audio alerts
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icona applicazione: stessa identita' dell'app cliente, sfondo blu brand #0F4E8C.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0F4E8C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/sounds/
    - assets/images/
    - assets/icons/
    - assets/icons_svg/
    - assets/icon/

  # Poppins incluso nell'app invece di scaricato a runtime da google_fonts.
  # Con il download i primi fotogrammi (o l'intera schermata, se non si
  # ricostruisce) uscivano nel font di sistema: San Francisco su iOS. In piu'
  # ogni avvio contattava i server Google trasmettendo l'IP dell'utente.
  # Il nome famiglia deve restare "Poppins": google_fonts riconosce i font
  # dichiarati qui e smette di scaricarli.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
